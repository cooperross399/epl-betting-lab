name: Closing Snapshot

# Records what the market looked like shortly before kick-off, and nothing else.
#
# WHY THIS EXISTS: closing-line value is the only feedback this project has that
# returns an answer inside a season. Profit needs roughly 1,500 settled bets to
# separate a 5% edge from zero — about twelve seasons at this rate — and the
# live record holds 33. Every bet yields a CLV reading the moment its market
# closes.
#
# And for the markets that carry the card it is the ONLY feedback there will
# ever be. Corners are 23 of the first 42 best bets, and no source retains
# corner prices historically, so no corner rule can ever be profit-backtested.
# Either the price is observed before kick-off or that market is unmeasurable
# forever.
#
# WHY IT IS SEPARATE FROM MATCHDAY REFRESH: that workflow's triggers all have to
# land before the 07:30 relay, because the card is read at 08:00 New York.
# These have to land just before kick-off, hours later. Putting both schedules
# in one file would make each set of times look like a mistake to whoever read
# it next, and would break the invariant that every matchday trigger precedes
# the relay.
#
# SCOPE: this fetches prices and appends them to a record. It builds no card,
# rebuilds no report, sends nothing, and touches no protected file. It cannot
# change what is bet.
#
# COST: about 500 requests a run, five runs a week — roughly 10,875 a month.
# With Matchday Refresh's fifteen at 122 the scheduled total is about 18,800
# against an allowance of 20,000.
#
# It was seven runs a week, which put the scheduled total at 23,200 and over
# the plan. Before that it was described here as 80 a run against 3,635,487
# remaining; both halves of that were dead — the figure was never measured, and
# the plan is 20,000 a month now.
#
# The two firings that came out cost real CLV coverage. Cooper chose that over
# a smaller allowance on 2026-09-29.
#
# A LATE TRIGGER IS SAFE, NOT WRONG. GitHub delays scheduled runs, sometimes by
# hours — this repository lost a Thursday card to a nine-hour delay. A snapshot
# that fires after kick-off simply records an observation with a later
# timestamp, and `live_clv` only ever reads observations strictly before
# kick-off, so a late run is ignored for the fixtures that have started and
# still useful for the ones that have not.
#
# BUT A CRON AIMED AT ITS SLOT ALMOST NEVER LANDED THERE. Between 2026-09-08
# and 2026-09-29 these runs started 2.4 h late at the median and 4.8 h at
# worst, against a twenty-minute lead. Every Friday and Monday firing landed
# after its 20:00 UK kick-off, the Monday ones after the final whistle, so the
# single-slot days this schedule protects got no closing observation at all.
# So each cron now fires eight hours before its slot and the run waits for the
# slot (scripts/wait_for_round.py); see the schedule below.

on:
  schedule:
    # Twenty minutes before a kick-off slot, in UTC, allowing for the UK being
    # UTC+1 in summer: Saturday 12:30 and 15:00 UK, Sunday 14:00 UK, Friday and
    # Monday evening 20:00 UK.
    #
    # WHICH TWO CAME OUT, AND WHY THOSE. Five firings fit the allowance and
    # seven do not, so two slots lose their near-kickoff observation. The two
    # dropped are the LATE slot on a day that already has an earlier one —
    # Saturday 17:30 UK and Sunday 16:30 UK. A snapshot fetches every upcoming
    # fixture, not just the imminent one, so those kick-offs still get an
    # observation from the same day's earlier firing: about 2h50 before, rather
    # than 20 minutes.
    #
    # Friday and Monday keep theirs for the same reason reversed. They are
    # single-slot days, so dropping one would leave those fixtures with nothing
    # nearer than that morning's Matchday Refresh — roughly ten hours out. The
    # question is never how many fixtures a slot holds, it is how stale the
    # nearest surviving observation would be.
    #
    # EACH CRON FIRES EIGHT HOURS BEFORE ITS SLOT (ROUND_LEAD in
    # scripts/wait_for_round.py), and the `wait` jobs hold the run until the
    # slot: 03:10 is the Saturday 11:10 slot, 05:40 Saturday 13:40, 04:40
    # Sunday 12:40, and 10:40 the Friday and Monday 18:40. Lateness up to
    # eight hours now costs nothing; beyond it the run fetches as soon as it
    # starts, as every run did before. Moving a slot means moving its cron to
    # eight hours before it, and a cron that lands before midnight must move
    # its day back one. No cron here crosses midnight today.
    - cron: "10 3 * * 6"
    - cron: "40 5 * * 6"
    - cron: "40 4 * * 0"
    - cron: "40 10 * * 5"
    - cron: "40 10 * * 1"
  workflow_dispatch:

permissions:
  # Write, for exactly one ref: the price-feed branch. Nothing here pushes
  # anywhere else, and main only changes through pull requests.
  contents: write

jobs:
  # Hold a scheduled run until its slot. Two jobs, because one may run for at
  # most six hours and a slot is eight away; each waits at most 340 minutes
  # and the second recomputes the slot from the same cron. A manual dispatch
  # does not wait. No install, no secret, no credit, no write.
  wait:
    name: Wait for the slot
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Wait for the slot
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: python3 scripts/wait_for_round.py --schedule "$SCHEDULE" --budget-minutes 340

  wait-more:
    name: Wait for the slot (continued)
    needs: wait
    # A wait that failed must not cost the observation: fetch late rather
    # than not at all.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Wait for the slot
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: python3 scripts/wait_for_round.py --schedule "$SCHEDULE" --budget-minutes 340

  snapshot:
    name: Closing Snapshot
    needs: wait-more
    # Spelled out: a bare condition carries an implicit success() over every
    # job upstream, so a failed wait would skip the snapshot.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # On the job, not the workflow: scheduled runs wait for hours, and a
    # workflow-level group keeps only one pending run, where the next one
    # cancels it. Snapshots still never write the feed two at once.
    concurrency:
      group: closing-snapshot
      cancel-in-progress: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Check the provider credential
        # Hard: without a key there is no snapshot, and a silent skip would
        # leave a gap in the record that looks like a quiet market.
        env:
          EPL_ODDS_API_KEY: ${{ secrets.EPL_ODDS_API_KEY }}
          PYTHONPATH: src
        run: |
          python scripts/check_provider_credential.py --no-env-file

      - name: Fetch prices
        # The same live fetch the matchday refresh runs. Soft: a bad minute at
        # the provider costs one observation, not the record.
        id: prices
        continue-on-error: true
        env:
          EPL_ODDS_API_KEY: ${{ secrets.EPL_ODDS_API_KEY }}
          PYTHONPATH: src
        run: |
          python scripts/run_provider_shadow_verification.py \
            --provider odds_api --live --overwrite-staging --include-event-markets

      - name: Restore the price feeds before collecting into them
        # `>` truncates its target before the command on the left runs. So
        #
        #     git show ...:price_feed_efl.csv > data/processed/price_feed_efl.csv
        #
        # emptied the file whenever the branch did not have that path yet — and
        # on the first run it never does. The EFL collection had already
        # written 1,203 observations there, reported "Added 1,203 new
        # observation(s)", and the publish step blanked them a moment later and
        # then skipped the empty file. A step that succeeded, a number that was
        # true when printed, and nothing on the branch.
        #
        # The same line also meant the EFL feed could never accumulate: every
        # run began from whatever the restore left, which was nothing.
        #
        # Restoring through a temporary file fixes both. A feed is replaced only
        # by content that actually arrived.
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}"
          mkdir -p data/processed
          # Restore one feed, trying each name it has ever had. The second
          # name carries the pre-rename file across on first sight; after that
          # the publish stops writing it and it leaves the branch.
          restore_feed() {
            DEST="$1"
            shift
            for NAME in "$@"; do
              TMP=$(mktemp)
              if git show "refs/price-feed-tip:$NAME" > "$TMP" 2>/dev/null && [ -s "$TMP" ]; then
                mv "$TMP" "data/processed/$DEST"
                if [ "$NAME" = "$DEST" ]; then
                  wc -l < "data/processed/$DEST" | xargs echo "restored $DEST rows:"
                else
                  wc -l < "data/processed/$DEST" | xargs echo "migrated $NAME -> $DEST, rows:"
                fi
                return 0
              fi
              rm -f "$TMP"
            done
            echo "no $DEST on the branch yet; starting one."
          }

          if git fetch "$REMOTE" +refs/heads/price-feed:refs/price-feed-tip 2>/dev/null; then
            restore_feed price_feed.csv price_feed.csv
            restore_feed price_feed_extra.csv price_feed_extra.csv price_feed_efl.csv
          fi

      - name: Observe EFL prices
        # Separate from the Premier League fetch in every way that matters.
        #
        # The EFL backtest on Football-Data's own closing prices came back
        # negative, so nothing here reaches the card and nothing here is a
        # recommendation. What it buys is the only evidence that can ever exist
        # for four of the seven card markets: both teams to score, double
        # chance and all three corner markets have no free price history in any
        # division, ever. Corners are three of the seven the card stakes. A
        # price nobody wrote down on the day cannot be recovered later, and a
        # rule can always be re-run over stored prices.
        #
        # `collect_extra_competitions.py` gives the provider an explicit repository
        # root in a temporary directory, so it cannot write `data/staging/` —
        # the bundle the Premier League card is built from. A test compares
        # that directory byte for byte across a collection.
        id: efl_prices
        if: always()
        continue-on-error: true
        env:
          EPL_ODDS_API_KEY: ${{ secrets.EPL_ODDS_API_KEY }}
          PYTHONPATH: src
        run: |
          set -u
          python scripts/collect_extra_competitions.py --live \
            --feed data/processed/price_feed_extra.csv

      - name: Append the observation to the price feed
        id: append
        # Plumbing commit, and append-only. The prior feed is read from the
        # branch rather than from an artifact, so it survives the 90-day
        # artifact expiry, and a snapshot that runs twice adds nothing because
        # the rows deduplicate on the observation itself.
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: src
        run: |
          set -u
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}"
          mkdir -p data/processed
          PARENT=""
          if git fetch "$REMOTE" +refs/heads/price-feed:refs/price-feed-tip 2>/dev/null; then
            PARENT=$(git rev-parse refs/price-feed-tip)
          fi
          # The feeds were restored above, before anything collected into them.
          # Restoring again here would overwrite this run's own observations —
          # and `>` would empty the file outright for any path the branch does
          # not carry yet.
          python scripts/append_price_snapshot.py --feed data/processed/price_feed.csv
          # Two feeds on one branch, never one file holding two competitions.
          # Nothing in this project carries a competition on a row — every
          # identity is (date, home_team, away_team) — so merged, the two would
          # be distinguishable only by club name. A file that was collected
          # separately stays separate.
          #
          # Built from whichever feeds actually have content, so an EFL
          # collection that failed cannot withhold the Premier League feed, and
          # a first EFL run cannot be mistaken for "nothing to publish".
          # The retired name is listed so the old file leaves the branch once its
          # rows have been migrated into the new one.
          REPLACING="price_feed.csv|price_feed_extra.csv|price_feed_efl.csv"
          # Start from whatever the branch already holds and replace only the
          # files this run produced. `git mktree` builds a tree from exactly
          # the entries it is given, so a tree built from one file IS a commit
          # that deletes every other file on the branch.
          #
          # Two workflows write this branch. Matchday Refresh published a
          # single-file tree four times a day, which deleted
          # `price_feed_efl.csv` on every run: the Closing Snapshot of
          # 2026-09-13 18:08 published 1,428 EFL observations, four Matchday
          # Refresh pushes followed on 2026-09-14, and the next snapshot
          # reported "no price_feed_efl.csv on the branch yet" and started
          # again from zero. Seven successful collections over a weekend left
          # 978 rows.
          KEEP=""
          if [ -n "$PARENT" ]; then
            KEEP=$(git ls-tree "$PARENT" | grep -vE "	($REPLACING)$" || true)
          fi
          ENTRIES=""
          for FEED in price_feed.csv price_feed_extra.csv; do
            if [ -s "data/processed/$FEED" ]; then
              B=$(git hash-object -w "data/processed/$FEED")
              ENTRIES="${ENTRIES}100644 blob ${B}\t${FEED}\n"
            fi
          done
          if [ -z "$ENTRIES" ] && [ -z "$KEEP" ]; then
            echo "Nothing to publish."
            # Distinct from `unchanged`: there was no feed on disk at all,
            # not a feed that already matched the branch. The gate reports
            # it rather than failing — an empty fetch is already warned
            # about above — but it must not read as an append.
            echo "state=nothing-to-publish" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TREE=$(printf '%s\n%b' "$KEEP" "$ENTRIES" | grep -v '^$' | git mktree)
          if [ -n "$PARENT" ] && [ "$(git rev-parse "$PARENT^{tree}")" = "$TREE" ]; then
            echo "Feed unchanged; nothing to commit."
            # A delivered outcome: the observation was already on the branch.
            echo "state=unchanged" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          export GIT_AUTHOR_NAME="Closing Snapshot" GIT_AUTHOR_EMAIL="actions@github.com"
          export GIT_COMMITTER_NAME="Closing Snapshot" GIT_COMMITTER_EMAIL="actions@github.com"
          if [ -n "$PARENT" ]; then
            COMMIT=$(git commit-tree "$TREE" -p "$PARENT" -m "prices $(date -u +%FT%TZ)")
          else
            COMMIT=$(git commit-tree "$TREE" -m "prices $(date -u +%FT%TZ)")
          fi
          git push "$REMOTE" "$COMMIT:refs/heads/price-feed"
          wc -l < data/processed/price_feed.csv | xargs echo "price-feed rows:"
          if [ -s data/processed/price_feed_extra.csv ]; then
            wc -l < data/processed/price_feed_extra.csv | xargs echo "extra-feed rows:"
          fi
          echo "state=appended" >> "$GITHUB_OUTPUT"

      - name: Report the outcome
        # THE STEP THAT PERSISTS ANYTHING WAS NEVER CHECKED. This read only
        # `steps.prices.outcome` and printed "Snapshot finished." — so a
        # snapshot that fetched several hundred book-level prices and then
        # failed to push a single one of them finished green, with no
        # annotation and a log line saying it was done.
        #
        # That matters more here than in most workflows. This feed is the only
        # forward evidence the corner markets will ever have, `live_clv`
        # ignores any observation taken after kick-off, and a snapshot that
        # never publishes and one that publishes late produce the same empty
        # column. Nothing downstream would ever notice.
        #
        # An empty state means the step died before either of its exits — the
        # `set -u` abort, a failed fetch, a failed push.
        if: always()
        run: |
          if [ "${{ steps.prices.outcome }}" = "failure" ]; then
            echo "::warning::Prices could not be fetched this snapshot. One observation is missing; the record is intact."
          fi
          if [ "${{ steps.efl_prices.outcome }}" = "failure" ]; then
            echo "::warning::The EFL and beyond-the-Premier-League prices could not be fetched this snapshot."
          fi
          APPENDED="${{ steps.append.outputs.state }}"
          if [ "${{ steps.append.outcome }}" != "success" ] || [ -z "$APPENDED" ]; then
            echo "::error::The observation did not reach the price-feed branch (outcome=${{ steps.append.outcome }}, state=${APPENDED:-none}). Nothing was recorded, and a snapshot that publishes nothing is indistinguishable downstream from one that never ran."
            exit 1
          fi
          if [ "$APPENDED" = "nothing-to-publish" ]; then
            echo "::warning::This snapshot had no feed to publish. Nothing was recorded; check the fetch warnings above."
          fi
          echo "price-feed: $APPENDED"
          echo "Snapshot finished."
