name: Harvest Historical BTTS

# Manual only, and it spends real provider credits: ten per event.
#
# Despite the name it buys whatever `markets` asks for, and until 2026-09-02
# it had bought corners and player props and never once bought BTTS - the
# market it is named after, and the market the repo kept describing as
# impossible to backtest. The reason it never did is now fixed: what counted
# as "already bought" was a fixture, with no market in the key, so asking for
# BTTS over a window already bought for corners skipped every fixture and
# spent nothing while reporting success.
#
# The credit ceiling is required, not defaulted. A harvest that silently spent
# a season's budget would be a worse outcome than one that stops short.
on:
  workflow_dispatch:
    inputs:
      start:
        description: "First day to sample, YYYY-MM-DD"
        required: true
      end:
        description: "Last day to sample, YYYY-MM-DD"
        required: true
      credit_limit:
        description: "Hard ceiling on credits spent. ~110 buys one matchday."
        required: true
        default: "500"
      markets:
        description: "Comma-separated market keys. Each multiplies the credit cost."
        required: false
        default: "btts"
      hours_before:
        description: "Sample this many hours before kick-off"
        required: false
        default: "3"
      append:
        description: "Add to the existing file rather than replacing it"
        type: boolean
        required: false
        default: true

permissions:
  contents: read
  actions: read

concurrency:
  # Two harvests at once would double-spend and interleave their rows.
  group: harvest-historical-btts
  cancel-in-progress: false

jobs:
  harvest:
    name: Harvest Historical BTTS
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Restore what has already been bought
        # Credits already spent must not be spent again. Each run appends to
        # the previous run's file, so a season can be bought in pieces.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          mkdir -p data/processed
          # The newest run holding the file wins, whatever its conclusion:
          # the artifact uploads even when a later step fails, and a failed
          # run's purchases are still purchases. Restoring only from green
          # runs once orphaned a harvest that crashed on its summary line,
          # which would have re-bought every fixture it had just paid for.
          for id in $(gh run list --workflow harvest-historical-btts.yml \
            --limit 10 --json databaseId --jq '.[].databaseId'); do
            if gh run download "$id" --name historical-btts --dir data/processed 2>/dev/null; then
              echo "Restored the harvest file from run $id."
              break
            fi
          done
          wc -l data/processed/historical_market_odds.csv 2>/dev/null \
            || echo "No previous harvest. Starting a new file."

      - name: Harvest
        env:
          EPL_ODDS_API_KEY: ${{ secrets.EPL_ODDS_API_KEY }}
          PYTHONPATH: src
        run: |
          python scripts/harvest_historical_btts.py \
            --start "${{ inputs.start }}" \
            --end "${{ inputs.end }}" \
            --credit-limit "${{ inputs.credit_limit }}" \
            --hours-before "${{ inputs.hours_before }}" \
            --markets "${{ inputs.markets }}" \
            ${{ inputs.append == true && '--append' || '' }}

      - name: Upload the prices
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-btts
          # The misses file rides along or it is lost, and a fixture/market
          # pair with no price anywhere gets re-bought on every future run.
          path: |
            data/processed/historical_market_odds.csv
            data/processed/historical_market_odds_misses.csv
          if-no-files-found: warn
          retention-days: 90

      - name: Scope reminder
        if: always()
        run: |
          echo "This job bought historical prices and wrote a CSV."
          echo "It placed no bet, changed no policy, and produced no card."
