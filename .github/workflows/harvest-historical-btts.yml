name: Harvest Historical BTTS

# Manual only, and it spends real provider credits: ten per event.
#
# Despite the name it buys whatever `markets` asks for, and until 2026-09-02
# it had bought corners and player props and never once bought BTTS - the
# market it is named after, and the market the repo kept describing as
# impossible to backtest. The reason it never did is now fixed: what counted
# as "already bought" was a fixture, with no market in the key, so asking for
# BTTS over a window already bought for corners skipped every fixture and
# spent nothing while reporting success.
#
# The credit ceiling is required, not defaulted. A harvest that silently spent
# a season's budget would be a worse outcome than one that stops short.
on:
  workflow_dispatch:
    inputs:
      start:
        description: "First day to sample, YYYY-MM-DD"
        required: true
      end:
        description: "Last day to sample, YYYY-MM-DD"
        required: true
      credit_limit:
        description: "Hard ceiling on credits. Slate snapshots cost 10/day for days not yet cached, BEFORE any price; the run refuses a ceiling below that."
        required: true
        default: "15000"
      markets:
        description: "Comma-separated market keys. Each multiplies the credit cost."
        required: false
        default: "btts"
      hours_before:
        description: "Sample this many hours before kick-off"
        required: false
        default: "3"
      append:
        description: "Add to the existing file rather than replacing it"
        type: boolean
        required: false
        default: true

permissions:
  # Write, for exactly one ref: the odds-history branch, the same way the
  # Closing Snapshot workflow owns price-feed. Nothing here pushes anywhere
  # else, and main only ever changes through a pull request.
  contents: write
  actions: read

concurrency:
  # Two harvests at once would double-spend and interleave their rows.
  group: harvest-historical-btts
  cancel-in-progress: false

jobs:
  harvest:
    name: Harvest Historical BTTS
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Restore what has already been bought
        # Credits already spent must not be spent again. Each run appends to
        # the previous run's file, so a season can be bought in pieces.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          mkdir -p data/processed
          # The odds-history branch first: it is permanent. Artifacts expire
          # after ninety days, and roughly 26,000 credits of purchased prices
          # living only in one is a countdown to re-buying a season nobody
          # noticed had gone.
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}"
          if git fetch "$REMOTE" +refs/heads/odds-history:refs/odds-history-tip 2>/dev/null; then
            git show refs/odds-history-tip:historical_market_odds.csv \
              > data/processed/historical_market_odds.csv 2>/dev/null || true
            git show refs/odds-history-tip:historical_market_odds_misses.csv \
              > data/processed/historical_market_odds_misses.csv 2>/dev/null || true
            git show refs/odds-history-tip:historical_market_odds_fixtures.csv \
              > data/processed/historical_market_odds_fixtures.csv 2>/dev/null || true
            echo "Restored from the odds-history branch."
          fi
          # Fall back to artifacts, which is where every harvest before
          # 2026-09-02 put its rows. The newest run holding the file wins,
          # whatever its conclusion: the artifact uploads even when a later
          # step fails, and a failed run's purchases are still purchases.
          # Restoring only from green runs once orphaned a harvest that
          # crashed on its summary line, which would have re-bought every
          # fixture it had just paid for.
          if [ ! -s data/processed/historical_market_odds.csv ]; then
            for id in $(gh run list --workflow harvest-historical-btts.yml \
              --limit 10 --json databaseId --jq '.[].databaseId'); do
              if gh run download "$id" --name historical-btts --dir data/processed 2>/dev/null; then
                echo "Restored the harvest file from run $id."
                break
              fi
            done
          fi
          wc -l data/processed/historical_market_odds.csv 2>/dev/null \
            || echo "No previous harvest. Starting a new file."

      - name: Harvest
        env:
          EPL_ODDS_API_KEY: ${{ secrets.EPL_ODDS_API_KEY }}
          PYTHONPATH: src
        run: |
          python scripts/harvest_historical_btts.py \
            --start "${{ inputs.start }}" \
            --end "${{ inputs.end }}" \
            --credit-limit "${{ inputs.credit_limit }}" \
            --hours-before "${{ inputs.hours_before }}" \
            --markets "${{ inputs.markets }}" \
            ${{ inputs.append == true && '--append' || '' }}

      - name: Publish the prices to the odds-history branch
        # Permanent, unlike an artifact. Same mechanism the Closing Snapshot
        # workflow uses for price-feed: an orphan commit built with
        # commit-tree, pushed to one ref, touching nothing else.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if [ ! -s data/processed/historical_market_odds.csv ]; then
            echo "Nothing bought; nothing to publish."
            exit 0
          fi
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}"
          PARENT=""
          if git rev-parse refs/odds-history-tip >/dev/null 2>&1; then
            PARENT=$(git rev-parse refs/odds-history-tip)
          fi
          ODDS=$(git hash-object -w data/processed/historical_market_odds.csv)
          ENTRIES=$(printf '100644 blob %s\thistorical_market_odds.csv' "$ODDS")
          if [ -s data/processed/historical_market_odds_misses.csv ]; then
            MISSES=$(git hash-object -w data/processed/historical_market_odds_misses.csv)
            ENTRIES=$(printf '%s\n100644 blob %s\thistorical_market_odds_misses.csv' \
              "$ENTRIES" "$MISSES")
          fi
          # The fixture cache rides along or every run re-buys the slate
          # snapshots: 283 days a season, ten credits each, 2,830 credits
          # before a single price.
          if [ -s data/processed/historical_market_odds_fixtures.csv ]; then
            FIXTURES=$(git hash-object -w data/processed/historical_market_odds_fixtures.csv)
            ENTRIES=$(printf '%s\n100644 blob %s\thistorical_market_odds_fixtures.csv' \
              "$ENTRIES" "$FIXTURES")
          fi
          TREE=$(printf '%s\n' "$ENTRIES" | git mktree)
          if [ -n "$PARENT" ] && [ "$(git rev-parse "$PARENT^{tree}")" = "$TREE" ]; then
            echo "Nothing new was bought; not committing."
            exit 0
          fi
          export GIT_AUTHOR_NAME="Historical Harvest" GIT_AUTHOR_EMAIL="actions@github.com"
          export GIT_COMMITTER_NAME="Historical Harvest" GIT_COMMITTER_EMAIL="actions@github.com"
          if [ -n "$PARENT" ]; then
            COMMIT=$(git commit-tree "$TREE" -p "$PARENT" -m "odds $(date -u +%FT%TZ)")
          else
            COMMIT=$(git commit-tree "$TREE" -m "odds $(date -u +%FT%TZ)")
          fi
          git push "$REMOTE" "$COMMIT:refs/heads/odds-history"
          wc -l < data/processed/historical_market_odds.csv \
            | xargs echo "odds-history rows:"

      - name: Upload the prices
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-btts
          # The misses file rides along or it is lost, and a fixture/market
          # pair with no price anywhere gets re-bought on every future run.
          path: |
            data/processed/historical_market_odds.csv
            data/processed/historical_market_odds_misses.csv
            data/processed/historical_market_odds_fixtures.csv
          if-no-files-found: warn
          retention-days: 90

      - name: Scope reminder
        if: always()
        run: |
          echo "This job bought historical prices and wrote a CSV."
          echo "It placed no bet, changed no policy, and produced no card."
