name: Manual Thursday Workflow

on:
  workflow_dispatch:
    inputs:
      current_odds_path:
        description: Repository-relative path to the prepared current odds CSV
        required: true
        default: data/manual/current_odds.csv
        type: string
      fixtures_path:
        description: Repository-relative path to the prepared upcoming fixtures CSV
        required: true
        default: data/manual/upcoming_fixtures.csv
        type: string
      expected_current_odds_sha256:
        description: Optional SHA-256 for the prepared current odds CSV
        required: false
        default: ""
        type: string
      expected_fixtures_sha256:
        description: Optional SHA-256 for the prepared fixtures CSV
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  build-thursday-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Compile check
        id: compile
        run: python -m compileall -q src scripts app.py

      - name: Run tests
        id: tests
        run: python -m pytest

      - name: Run safe scheduled Thursday workflow
        id: scheduled
        continue-on-error: true
        env:
          CURRENT_ODDS_PATH: ${{ inputs.current_odds_path }}
          FIXTURES_PATH: ${{ inputs.fixtures_path }}
          EXPECTED_CURRENT_ODDS_SHA256: ${{ inputs.expected_current_odds_sha256 }}
          EXPECTED_FIXTURES_SHA256: ${{ inputs.expected_fixtures_sha256 }}
        shell: bash
        run: |
          set +e
          python scripts/run_scheduled_thursday_workflow.py \
            --github-runner-handoff \
            --current-odds-path="$CURRENT_ODDS_PATH" \
            --fixtures-path="$FIXTURES_PATH" \
            --expected-current-odds-sha256="$EXPECTED_CURRENT_ODDS_SHA256" \
            --expected-fixtures-sha256="$EXPECTED_FIXTURES_SHA256"
          exit_code=$?
          set -e
          echo "exit_code=${exit_code}" >> "$GITHUB_OUTPUT"
          if [[ "${exit_code}" -eq 2 ]]; then
            echo "::warning::Thursday workflow is Blocked. Review the uploaded summary and fix the listed prerequisites."
          elif [[ "${exit_code}" -ne 0 ]]; then
            echo "::error::Scheduled Thursday runner failed with exit code ${exit_code}."
          fi
          exit "${exit_code}"

      - name: Verify manual Thursday run evidence
        id: verification
        if: always()
        continue-on-error: true
        run: python scripts/verify_github_manual_thursday_run.py

      - name: Upload Thursday reports
        id: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scheduled-thursday-reports-${{ github.run_number }}-${{ github.run_attempt }}
          path: data/outputs/
          if-no-files-found: warn
          retention-days: 14

      - name: Write GitHub Actions job summary
        if: always()
        env:
          RUNNER_EXIT_CODE: ${{ steps.scheduled.outputs.exit_code }}
          ARTIFACT_OUTCOME: ${{ steps.upload.outcome }}
        shell: bash
        run: |
          {
            echo "## EPL Betting Lab Thursday workflow"
            echo ""
            echo "- Runner exit code: \`${RUNNER_EXIT_CODE:-not available}\`"
            echo "- Artifact upload: **${ARTIFACT_OUTCOME:-not available}**"
            echo "- Artifact: \`scheduled-thursday-reports-${{ github.run_number }}-${{ github.run_attempt }}\`"
            echo "- Download it from the **Artifacts** section of this workflow run."
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import csv
          import json
          from pathlib import Path

          summary_path = Path("data/outputs/scheduled_thursday_workflow_summary.json")
          if not summary_path.exists():
              print("- Workflow status: **Summary unavailable**")
              print("- The runner did not create its JSON summary. Review the failed step logs.")
          else:
              try:
                  summary = json.loads(summary_path.read_text(encoding="utf-8"))
              except (OSError, UnicodeError, json.JSONDecodeError) as exc:
                  print("- Workflow status: **Summary unreadable**")
                  print(f"- Summary error: {exc}")
              else:
                  status = summary.get("status", "Not available")
                  next_action = summary.get("recommended_next_action", "Review the uploaded reports.")
                  skipped = summary.get("steps_skipped", [])
                  print(f"- Workflow status: **{status}**")
                  print(f"- Recommended next action: {next_action}")
                  handoff = summary.get("input_handoff")
                  if isinstance(handoff, dict):
                      allowed = "Yes" if handoff.get("card_generation_allowed") else "No"
                      print("")
                      print("### Input handoff proof")
                      print(f"- GitHub ref: `{handoff.get('github_ref') or 'not available'}`")
                      print(f"- GitHub commit: `{handoff.get('github_sha') or 'not available'}`")
                      print(f"- Odds file used: `{handoff.get('current_odds_path', '')}`")
                      print(
                          "- Odds SHA-256: "
                          f"`{handoff.get('current_odds_checksum_sha256') or 'not available'}`"
                      )
                      print(
                          "- Odds freshness: "
                          f"**{handoff.get('current_odds_freshness_status', 'Not checked')}**"
                      )
                      print(f"- Fixtures file used: `{handoff.get('fixtures_path', '')}`")
                      print(
                          "- Fixtures SHA-256: "
                          f"`{handoff.get('fixtures_checksum_sha256') or 'not available'}`"
                      )
                      print(
                          "- Fixtures freshness: "
                          f"**{handoff.get('fixtures_freshness_status', 'Not checked')}**"
                      )
                      print(
                          "- Odds validation: "
                          f"**{handoff.get('validation_status', 'Not checked')}** "
                          f"({handoff.get('validation_serious_issue_count', 0)} serious, "
                          f"{handoff.get('validation_warning_count', 0)} warnings)"
                      )
                      print(
                          "- Odds completeness: "
                          f"**{handoff.get('completeness_status', 'Not checked')}** "
                          f"({float(handoff.get('completion_percentage', 0.0)):.1%})"
                      )
                      print(f"- Card generation allowed: **{allowed}**")
                  if skipped:
                      print(f"- Steps skipped safely: {', '.join(str(step) for step in skipped)}")

          verification_path = Path(
              "data/outputs/github_manual_thursday_run_verification.csv"
          )
          if not verification_path.exists():
              print("")
              print("### Manual run verification")
              print("- Verdict: **Verification report unavailable**")
          else:
              try:
                  with verification_path.open(encoding="utf-8", newline="") as handle:
                      rows = list(csv.DictReader(handle))
              except (OSError, UnicodeError, csv.Error) as exc:
                  print("")
                  print("### Manual run verification")
                  print("- Verdict: **Verification report unreadable**")
                  print(f"- Verification error: {exc}")
              else:
                  verdict_row = next(
                      (row for row in rows if row.get("category") == "Verdict"),
                      None,
                  )
                  print("")
                  print("### Manual run verification")
                  if verdict_row is None:
                      print("- Verdict: **Missing verdict row**")
                  else:
                      print(f"- Verdict: **{verdict_row.get('actual', 'Unknown')}**")
                      print(f"- Next step: {verdict_row.get('details', '')}")
          PY

      - name: Enforce intentional pass/fail result
        if: always()
        env:
          COMPILE_OUTCOME: ${{ steps.compile.outcome }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          RUNNER_EXIT_CODE: ${{ steps.scheduled.outputs.exit_code }}
          VERIFICATION_OUTCOME: ${{ steps.verification.outcome }}
          ARTIFACT_OUTCOME: ${{ steps.upload.outcome }}
        shell: bash
        run: |
          if [[ "${COMPILE_OUTCOME}" != "success" || "${TEST_OUTCOME}" != "success" ]]; then
            echo "::error::Compile or test checks did not pass."
            exit 1
          fi
          if [[ "${ARTIFACT_OUTCOME}" != "success" ]]; then
            echo "::error::Thursday report artifacts were not uploaded successfully."
            exit 1
          fi
          if [[ "${VERIFICATION_OUTCOME}" != "success" ]]; then
            echo "::error::Manual Thursday run verification did not produce a trusted ready/blocked verdict."
            exit 1
          fi
          case "${RUNNER_EXIT_CODE}" in
            0)
              echo "Scheduled Thursday workflow completed without a blocking status."
              ;;
            2)
              echo "::warning::Scheduled Thursday workflow was Blocked safely. The Action remains successful so the summary can be reviewed."
              ;;
            1)
              echo "::error::Scheduled Thursday workflow reported a runtime failure."
              exit 1
              ;;
            *)
              echo "::error::Scheduled Thursday workflow returned an unexpected or missing exit code: ${RUNNER_EXIT_CODE:-not available}."
              exit 1
              ;;
          esac
