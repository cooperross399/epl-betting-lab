name: Matchday Refresh

# Hands-off weekly refresh. Runs on GitHub's infrastructure so no laptop needs
# to be open and no command needs to be typed.
#
# SCOPE: this refetches prices and rebuilds reports. It does NOT place a bet,
# apply settlement, edit any protected manual file, allowlist a provider, or
# widen market scope. Those remain human decisions and no schedule can take
# them. A card is a recommendation.
#
# CADENCE: one run per day that has matches, plus the Thursday planning card.
#
# The provider policy treats a run older than 12 hours as stale, and a stale
# card is refused. So the schedule has to reach every matchday, not just the
# start of the week. A Thursday-and-Friday schedule looked sufficient and was
# not: Friday's run expires at 01:00 UTC Saturday, while a typical matchweek
# puts six matches on Saturday, three on Sunday and one on Monday. Nine of
# eleven would have been read from an already-blocked card.
#
# Each run is timed to land before that day's earliest kick-off and stay fresh
# through its latest, allowing for the UK being UTC+1 in summer:
#
#   Thursday  13:00 UTC  planning card; no matches
#   Friday    13:00 UTC  ~6h before a 20:00 UK kick-off
#   Saturday  09:00 UTC  ~2.5h before a 12:30 UK kick-off, fresh until 21:00
#   Sunday    09:00 UTC  covers the afternoon slate
#   Monday    13:00 UTC  ~6h before a 20:00 UK kick-off
#
# COST: measured, not estimated. Two live runs moved the counter from 340 to
# 311, so a run costs about 15 requests. Five runs a week is therefore roughly
# 325 a month against a 500 allowance. An earlier estimate of 12 was 25% low,
# which is worth stating: the number that matters here is measured from the
# counter, not derived from the request pattern.
#
# That 500 is understood to be a monthly allowance. If it turns out to be a
# lifetime one, the remaining balance is a few weeks, not a season — so every
# run prints the quota remaining and the run summary carries it, letting the
# number fall in public rather than being discovered at zero.
on:
  schedule:
    - cron: "0 13 * * 4"
    - cron: "0 13 * * 5"
    - cron: "0 9 * * 6"
    - cron: "0 9 * * 0"
    - cron: "0 13 * * 1"
  workflow_dispatch:
    inputs:
      skip_provider_fetch:
        description: "Rebuild reports from existing evidence without refetching prices"
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  # Read-only, and only so the run can fetch the previous run's card archive.
  # Nothing here can write to the repository.
  actions: read
  # Lets the run comment the card on an issue, which is what delivers it by
  # email. This writes issue comments and nothing else — no code, no branches,
  # no releases.
  issues: write

concurrency:
  # Never let two refreshes write staging at once.
  group: matchday-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Matchday Refresh
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Check the provider credential
        # Fails fast and legibly if the key was rotated without updating the
        # secret, rather than surfacing as a confusing provider error later.
        # Costs no quota and prints nothing about the key beyond its length.
        env:
          EPL_ODDS_API_KEY: ${{ secrets.EPL_ODDS_API_KEY }}
          PYTHONPATH: src
        run: |
          python scripts/check_provider_credential.py --no-env-file

      - name: Fetch historical results
        # The model is fitted on completed matches, and that dataset is derived
        # rather than tracked, so a runner has none of it. Without this step the
        # card cannot be generated at all — which is how the first live CI run
        # failed.
        #
        # Refetching weekly is not merely a workaround for the empty runner. The
        # season adds results every week and the model should be fitted on them;
        # a copy pinned at the start of the season would quietly get worse as
        # the season it is meant to predict went on.
        #
        # Football-Data.co.uk is public CSV over HTTP: no key, no quota, no
        # secret. It is the one external dependency here that is not the odds
        # provider, so it is fetched before any quota is spent — if it is down,
        # the run stops before it costs anything.
        env:
          PYTHONPATH: src
        run: |
          python scripts/fetch_data.py

      - name: Refetch provider prices
        if: ${{ inputs.skip_provider_fetch != true }}
        env:
          EPL_ODDS_API_KEY: ${{ secrets.EPL_ODDS_API_KEY }}
          PYTHONPATH: src
        run: |
          python scripts/run_provider_shadow_verification.py \
            --provider odds_api --live --overwrite-staging --include-event-markets

      - name: Restore the previous card archive
        # A runner is empty every time and the card archive is not tracked in
        # git, so without this each run has no memory of the last one and the
        # "since the previous refresh" diff is permanently blank — the Friday
        # card could never say what moved since Thursday.
        #
        # The archive is restored from the previous successful run's artifact.
        # This is additive: it only writes under the archive directory, so it
        # cannot overwrite the prices this run just fetched. A first run, a
        # pruned artifact, or any failure here is not fatal — the run continues
        # and simply reports no comparison.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          previous=$(gh run list \
            --workflow matchday-refresh.yml \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // empty')
          if [ -z "$previous" ]; then
            echo "No previous successful run. This run establishes the baseline."
            exit 0
          fi
          echo "Restoring the card archive from run $previous."
          mkdir -p data/outputs/archive/automated_cards
          gh run download "$previous" \
            --name matchday-card-archive \
            --dir data/outputs/archive/automated_cards || {
              echo "No card archive on run $previous; continuing without a comparison."
              exit 0
            }
          find data/outputs/archive/automated_cards -name '*.json' | wc -l \
            | xargs echo "Archived card runs restored:"

      - name: Rebuild every report
        env:
          PYTHONPATH: src
        run: |
          python scripts/refresh_all_reports.py

      - name: Write the card to the run summary
        if: always()
        env:
          PYTHONPATH: src
        run: |
          python scripts/build_run_summary.py --append-to-step-summary

      - name: Email the card when the picks change
        # Delivery. GitHub emails everyone watching the issue, so commenting is
        # the whole mechanism — no SMTP server, no credentials, no third party.
        #
        # Only when the selections change. Five emails a week would train the
        # reader to ignore them, and an alert nobody opens is worse than none
        # because it still looks like coverage. Silence is safe to read because
        # a failed run emails separately: no message means the run happened and
        # the picks did not move.
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: src
        run: |
          set -u
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          DECISION=$(python scripts/post_card_to_issue.py \
            --out card_comment.md --title-out card_title.txt \
            --run-url "$RUN_URL" | tail -1)
          if [ "$DECISION" != "post" ]; then
            echo "Not emailing: the selections did not change."
            exit 0
          fi
          # The title comes from the module so the two cannot drift apart and
          # start posting to different issues.
          TITLE=$(cat card_title.txt)
          # Matched exactly against the open issues rather than through the
          # search API: the title contains an apostrophe, and a search that
          # quietly returns nothing would create a duplicate issue every run.
          NUMBER=$(gh issue list --state open --limit 200 --json number,title \
            | jq -r --arg t "$TITLE" \
              '[.[] | select(.title == $t)] | .[0].number // empty')
          if [ -z "$NUMBER" ]; then
            echo "Creating the delivery issue."
            NUMBER=$(gh issue create --title "$TITLE" \
              --body "Each matchday card is posted here when the selections change. Watch this issue to get them by email. Recommendations only; no bet is ever placed." \
              | grep -o '[0-9]*$')
          fi
          gh issue comment "$NUMBER" --body-file card_comment.md
          echo "Card posted to issue #$NUMBER."

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matchday-reports
          path: |
            data/outputs/status.html
            data/outputs/run_summary.md
            data/outputs/automated_card.md
            data/outputs/automated_card_comparison.md
            data/outputs/epl_model_task.md
            data/outputs/epl_card_task.md
            data/outputs/epl_settle_preview_task.md
          if-no-files-found: warn
          retention-days: 30

      - name: Upload the card archive
        # Carries this run's card history forward so the next run can diff
        # against it. Retained longer than the reports because it is the only
        # link between one matchweek and the next.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matchday-card-archive
          path: data/outputs/archive/automated_cards
          if-no-files-found: warn
          retention-days: 90

      - name: Scope reminder
        if: always()
        run: |
          echo "This job refetched prices and rebuilt reports."
          echo "It placed no bet, applied no settlement, edited no protected"
          echo "manual file, allowlisted no provider, and widened no market scope."
