name: Matchday Refresh

# Hands-off matchday refresh. Runs on GitHub's infrastructure, so no laptop
# needs to be open and no command needs to be typed.
#
# SCOPE: this refetches prices and rebuilds reports. It does NOT place a bet,
# apply settlement, edit any protected manual file, allowlist a provider, or
# widen market scope. Those remain human decisions and no schedule can take
# them. A card is a recommendation.
#
# DESIGN RULE: a run never ends with nothing to show. Both external sources are
# outside this repository and will have bad days, so a failure downgrades the
# run rather than aborting it: the card is rebuilt from the last good state,
# the summary says exactly what went wrong, and the result is emailed even if
# the picks did not change. The run still finishes red, so the failure notice
# arrives too. Silence therefore always means "it ran and nothing moved", which
# is the only thing that makes silence safe to read.
#
# CADENCE: one run per day that can hold a match, plus the Thursday planning
# card.
#
# This was briefly Thursday-only, when 500 credits a month meant a second run
# cost more than an extra market was worth. On the 20,000 plan that trade is
# gone: every market the project can price, at every matchday, costs roughly
# 2,300 a month — about a ninth of the allowance.
#
# The reason to run more than once a week is the freshness policy. A run older
# than 12 hours is treated as stale and its card is refused, so Friday's run
# expires at 01:00 UTC Saturday. A typical matchweek puts six matches on
# Saturday, three on Sunday and one on Monday, all after that: a Thursday card
# read on Sunday is four days old.
#
# Each run lands before that day's earliest kick-off and stays fresh through its
# latest, allowing for the UK being UTC+1 in summer:
#
#   Thursday  04:30 UTC  planning card; no matches, and a 10:00 New York
#                        policy cutoff the run has to land in front of
#   Friday    09:00 UTC  ~10h before a 20:00 UK kick-off, fresh until 21:00
#   Saturday  09:00 UTC  ~2.5h before a 12:30 UK kick-off, fresh until 21:00
#   Sunday    09:00 UTC  covers the afternoon slate
#   Monday    09:00 UTC  ~10h before a 20:00 UK kick-off, fresh until 21:00
#
# Every day's last trigger is 10:30 UTC, because Cooper reads the card at
# 08:00 New York and the relay that carries it to him runs at 07:30. Friday
# and Monday used to sit at 11:30 and 13:00 — comfortably before their own
# evening kick-offs, and comfortably after the moment he actually reads. A
# card built after the read is a card he sees the following day.
#
# Nothing here is pinned by kick-off any more except the weekend, whose 12:30
# UK lunch match still sets the ceiling. The evenings have slack to spare: a
# 09:00 UTC run stays fresh until 21:00, and a 20:00 UK kick-off is 19:00 UTC.
#
# COST: measured, not estimated. A run is about 15 credits plus 10 for each
# extra per-event market. Every run prints the quota remaining and how many
# runs it buys.
on:
  schedule:
    # Each matchday is triggered twice, ninety minutes apart. GitHub documents
    # that scheduled workflows may be delayed or dropped entirely under load,
    # and one was dropped the day this was written: 13:00 Thursday produced no
    # run at all, while a Monday cron in the same repository had fired three
    # days earlier. A trigger that usually works is not a trigger a card can
    # depend on.
    #
    # Running twice is safe and nearly free. The concurrency group serialises
    # them, the second run simply refetches slightly fresher prices, and the
    # email only fires when the selections change — so a duplicate run is
    # invisible unless it has something new to say.
    #
    # Nineteen runs a week is about 5,100 credits a month against 20,000 —
    # roughly a quarter of the allowance. Measured from consecutive runs: the counter moves
    # about 62 a run with every market fetched. Two earlier notes here were
    # wrong in both directions, 1,050 and 4,600, each computed rather than
    # measured.
    # Thursday is the one day with a deadline in front of it. The provider
    # policy refuses a Thursday receipt made after 10:00 America/New_York —
    # 14:00 UTC in summer — so a Thursday run has a window, not just a time,
    # and every trigger has to land inside it.
    #
    # These used to sit at 11:30 and 13:00 UTC: the last two and a half hours
    # of a ten-hour window, leaving the later one an hour of slack. On
    # 2026-08-27 GitHub started both of them roughly nine and a half hours
    # late, at 21:06 and 22:50 UTC. Both produced a receipt stamped well after
    # the deadline, both were refused, and the emails read as a provider fault
    # rather than what it was — a cron that arrived late twice.
    #
    # So they now sit at the front of the window instead of the back, and the
    # window is measured in landing times rather than nominal ones — see the
    # lateness note below, which is what moved the last Thursday trigger from
    # 10:30 to 08:15. At the observed delay 10:30 lands about 15:30 UTC and is
    # refused every week, and because it fires last it would replace that
    # morning's good card with a blocked one.
    #
    # Nothing here relaxes the cutoff: a run that arrives after 10:00 New York
    # is still refused. Dispatching the workflow by hand is the documented way
    # through — the policy exempts a manual run because a person choosing to
    # run it late is the deliberate act the deadline exists to protect.
    #
    # LATENESS IS PART OF THE SCHEDULE NOW. Since 2026-08-27 GitHub has started
    # this repository's triggers four and a half to five and a half hours late,
    # every one of them; before that week the same crons ran 15 to 55 minutes
    # late. Measured, not assumed: 09:00 fired at 14:08 and 14:18 on the 29th
    # and 30th, and 10:30 fired at 15:08 and 14:56. Four for four. A nominal
    # time is therefore not a landing time, and every deadline below is checked
    # against nominal + 5h30 rather than against nominal.
    #
    # That splits each matchday's triggers into two roles:
    #
    #   READER   early enough that even a late start lands before the 11:30 UTC
    #            relay carries the card to the 08:00 New York read. A card built
    #            after the relay is a card he sees the following day, which is
    #            exactly what happened all weekend.
    #   FRESHNESS late enough that its card is still inside the 12-hour window at
    #            a 20:00 UTC evening kick-off. A reader trigger alone expires
    #            early afternoon; a freshness trigger alone never beats the relay.
    #
    # One trigger cannot hold both ends: 12-hour freshness at a 20:00 kick-off
    # needs 08:00 UTC or later, and beating the relay through a 5h30 delay needs
    # 06:00 UTC or earlier. So each matchday gets a pair of each, ninety minutes
    # apart, and the pairs are what makes a dropped trigger survivable.
    - cron: "0 3 * * 5"
    - cron: "30 4 * * 5"
    - cron: "0 9 * * 5"
    - cron: "30 10 * * 5"
    - cron: "0 3 * * 6"
    - cron: "30 4 * * 6"
    - cron: "0 9 * * 6"
    - cron: "30 10 * * 6"
    - cron: "0 3 * * 0"
    - cron: "30 4 * * 0"
    - cron: "0 9 * * 0"
    - cron: "30 10 * * 0"
    - cron: "0 3 * * 1"
    - cron: "30 4 * * 1"
    - cron: "0 9 * * 1"
    - cron: "30 10 * * 1"
    # Thursday is the exception, and the tightest day in the schedule. It has no
    # matches, so nothing needs to stay fresh into an evening — but it is fenced
    # on both sides: nothing before 04:00 UTC counts as a Thursday receipt in New
    # York, and nothing landing after 14:00 UTC is accepted at all. Through a
    # 5h30 delay that leaves 04:00 to 08:30 UTC for every trigger, and a spread
    # of 4 hours rather than the 6 it used to have. 04:15 keeps clear of the
    # New York midnight boundary, 05:45 is the last trigger that still beats
    # the relay, and 08:15 is the last one that cannot be refused outright.
    - cron: "15 4 * * 4"
    - cron: "45 5 * * 4"
    - cron: "15 8 * * 4"
  workflow_dispatch:
    inputs:
      skip_provider_fetch:
        description: "Rebuild reports from existing evidence without refetching prices"
        type: boolean
        required: false
        default: false
      force_email:
        description: "Send the card even if the selections did not change"
        type: boolean
        required: false
        default: false

permissions:
  # Write, for exactly one ref: the card-feed branch, where each run publishes
  # the rendered card so the EPL CARD routine can read it over plain git and
  # present it in Claude. Nothing in this workflow pushes anywhere else, and
  # main only changes through pull requests.
  contents: write
  # Read-only, and only so the run can fetch the previous run's state.
  actions: read
  # Lets the run write the card to an issue. That issue is now the written
  # record rather than the delivery: the comment mentions nobody and the
  # repository's notifications are ignored, so it arrives in no inbox.
  issues: write

concurrency:
  # Never let two refreshes write staging at once.
  group: matchday-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Matchday Refresh
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Restore the previous state
        # A runner starts empty, and neither the card archive nor the match
        # dataset is tracked in git. Without this every run begins with no
        # memory of the last one: the "since the previous refresh" diff stays
        # permanently blank, and a bad day at Football-Data means no card at
        # all rather than a card built on last week's results.
        #
        # Additive and scoped to data/, so it cannot overwrite the prices this
        # run is about to fetch. A first run, a pruned artifact, or an API
        # hiccup is not fatal.
        id: restore
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          previous=$(gh run list --workflow matchday-refresh.yml --status success \
            --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -z "$previous" ]; then
            echo "No previous successful run. This run establishes the baseline."
            exit 0
          fi
          mkdir -p data
          gh run download "$previous" --name matchday-state --dir data || {
            echo "No state on run $previous; continuing without it."
            exit 0
          }
          echo "Restored state from run $previous."
          find data/outputs/archive/automated_cards -name '*.json' 2>/dev/null \
            | wc -l | xargs echo "Archived card runs restored:"

      - name: Check the schedule has not gone quiet
        # A schedule that never fires produces no run, no summary, no email and
        # no red tick — indistinguishable from a week in which nothing changed,
        # which is the one failure the delivery design cannot otherwise see.
        # Measuring the gap behind this run catches a missed one; it cannot
        # catch a total absence, which is what the weekly watchdog is for.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: src
        run: |
          set -u
          : > run_degraded.txt
          previous=$(gh run list --workflow matchday-refresh.yml \
            --status success --limit 5 --json createdAt \
            --jq '.[].createdAt' | tr '\n' ' ')
          python scripts/check_schedule_health.py $previous \
            --append-to run_degraded.txt

      - name: Check the provider credential
        # Fails fast and legibly if the key was rotated without updating the
        # secret, rather than surfacing as a confusing provider error later.
        # Costs no quota and prints nothing about the key beyond its length.
        # This one is deliberately hard: without a key there is no refresh to
        # degrade to, and a dead credential must be loud.
        env:
          EPL_ODDS_API_KEY: ${{ secrets.EPL_ODDS_API_KEY }}
          PYTHONPATH: src
        run: |
          python scripts/check_provider_credential.py --no-env-file

      - name: Fetch historical results
        # The model is fitted on completed matches. Football-Data is public CSV
        # over HTTP: no key, no quota, no secret. Fetched before any quota is
        # spent, so an outage there costs nothing.
        #
        # Soft: if the fetch fails and the restored dataset is present, the run
        # continues on last week's results and says so. Fitting on results that
        # are a few days old is a far better outcome than no card.
        id: results
        continue-on-error: true
        env:
          PYTHONPATH: src
        run: |
          python scripts/fetch_data.py

      - name: Refresh the upcoming slate
        # The card can only look as far ahead as `upcoming_fixtures.csv` goes.
        # While that file was typed by hand it was a standing appointment
        # somebody had to keep, and when it ran out the selected window found
        # nothing upcoming and the card went quiet looking like a provider
        # fault. Football-Data publishes the coming fixtures as public CSV —
        # no key, no quota, no secret — in the same team naming the results
        # use.
        #
        # Deliberately not the odds provider: this file is the denominator the
        # shadow verifier uses to ask whether the provider covered the slate,
        # and a provider checked against itself always passes.
        #
        # Soft, and it never writes an empty slate: a bad day at Football-Data
        # leaves the previous fixtures in place, which is far better than a
        # card with no fixtures to be about.
        id: fixtures
        continue-on-error: true
        env:
          PYTHONPATH: src
        run: |
          python scripts/refresh_upcoming_fixtures.py

      - name: Fetch team xG
        # Understat's per-match expected goals, for the ratings the 2.5 line
        # is priced on. Public JSON, no key, no quota. Soft: a match with no xG
        # on file is rated on its goals instead, so a bad day at Understat
        # degrades the ratings rather than the card.
        id: xg
        continue-on-error: true
        env:
          PYTHONPATH: src
        run: |
          python scripts/fetch_understat_xg.py

      - name: Refetch provider prices
        # Soft for the same reason: without fresh prices the card is refused by
        # the freshness policy, and a blocked card that explains itself beats a
        # red X with a traceback.
        id: prices
        if: ${{ inputs.skip_provider_fetch != true }}
        continue-on-error: true
        env:
          EPL_ODDS_API_KEY: ${{ secrets.EPL_ODDS_API_KEY }}
          PYTHONPATH: src
        run: |
          python scripts/run_provider_shadow_verification.py \
            --provider odds_api --live --overwrite-staging --include-event-markets

      - name: Record what went wrong
        # One place that knows whether the run was degraded, so the summary,
        # the email, and the exit status cannot disagree about it.
        id: health
        if: always()
        run: |
          set -u
          # Created by the schedule-health step; appended to, never cleared.
          touch run_degraded.txt
          if [ ! -f data/processed/epl_historical_matches.csv ]; then
            echo "No match dataset: the model cannot be fitted, so no card can be built. Football-Data could not be reached and no previous copy was restored." >> run_degraded.txt
          elif [ "${{ steps.results.outcome }}" = "failure" ]; then
            echo "Historical results could not be refreshed; the model was fitted on the previously stored dataset." >> run_degraded.txt
          fi
          if [ "${{ steps.xg.outcome }}" = "failure" ]; then
            echo "Team xG could not be fetched from Understat; the ratings used goals alone this run." >> run_degraded.txt
          fi
          if [ "${{ steps.fixtures.outcome }}" = "failure" ]; then
            echo "The upcoming slate could not be refreshed from Football-Data; the previously stored fixtures were used. A slate that stops moving eventually leaves the card with no fixture in window." >> run_degraded.txt
          fi
          if [ "${{ steps.prices.outcome }}" = "failure" ]; then
            # The step exits non-zero both when the fetch fails and when the
            # fetch works and policy refuses the bundle. Ask the reports which
            # it was rather than assuming the first.
            # Exit 3 marks a refusal the policy is supposed to make, so the
            # run can decline without pretending to be broken.
            if python scripts/explain_provider_failure.py --expected-exit 3 \
                 >> run_degraded.txt; then
              :
            else
              if [ $? -eq 3 ]; then echo "expected_refusal=true" >> "$GITHUB_OUTPUT"; fi
            fi
          fi
          if [ -s run_degraded.txt ]; then
            echo "degraded=true" >> "$GITHUB_OUTPUT"
            cat run_degraded.txt
          else
            echo "degraded=false" >> "$GITHUB_OUTPUT"
            echo "Nothing went wrong."
          fi

      - name: Rebuild every report
        # Soft: refresh_all_reports already continues past a failed step and
        # exits non-zero at the end, so letting it stop the job here would
        # discard the reports it did produce.
        id: rebuild
        if: always()
        continue-on-error: true
        env:
          PYTHONPATH: src
        run: |
          python scripts/refresh_all_reports.py

      - name: Refresh the props card
        # Self-gating: while the reviewed policy holds every prop market,
        # this writes the Held-by-policy report and spends nothing. A props
        # failure must never cost a match card, hence continue-on-error.
        continue-on-error: true
        env:
          EPL_ODDS_API_KEY: ${{ secrets.EPL_ODDS_API_KEY }}
          PYTHONPATH: src
        run: |
          python scripts/run_props_card_refresh.py

      - name: Write the card to the run summary
        if: always()
        env:
          PYTHONPATH: src
        run: |
          python scripts/build_run_summary.py --append-to-step-summary \
            --degraded-file run_degraded.txt

      - name: Email the card
        # Delivery. GitHub emails everyone watching the issue, so commenting is
        # the whole mechanism: no SMTP server, no credentials, no third party.
        #
        # Normally only when the selections change — five emails a week would
        # train the reader to ignore them. But a degraded run always sends,
        # because silence is only safe to read as "nothing moved" if anything
        # going wrong breaks the silence.
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: src
        run: |
          set -u
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          # When a message was last sent, so at most one card a day goes out.
          TITLE_FOR_LOOKUP="EPL Card"
          LAST_SENT=$(gh issue list --state open --limit 200 --json number,title \
            | jq -r --arg t "$TITLE_FOR_LOOKUP" \
              '[.[] | select(.title | startswith($t))] | .[0].number // empty' \
            | xargs -r -I{} gh issue view {} --json comments \
              --jq '[.comments[].createdAt] | max // empty')
          DECISION=$(python scripts/post_card_to_issue.py \
            --out card_comment.md --title-out card_title.txt \
            --degraded-file run_degraded.txt --run-url "$RUN_URL" \
            --trigger "${{ github.event_name }}" \
            --last-sent "$LAST_SENT" | tail -1)
          if [ "${{ inputs.force_email }}" = "true" ]; then
            echo "Forced: sending the current card regardless of changes."
            DECISION=post
          fi
          if [ "$DECISION" != "post" ]; then
            echo "Not emailing: the run was clean and the selections did not change."
            exit 0
          fi
          # The title comes from the module so the two cannot drift apart and
          # start posting to different issues.
          TITLE=$(cat card_title.txt)
          # Matched exactly against the open issues rather than through the
          # search API: the title contains an apostrophe, and a search quietly
          # returning nothing would create a duplicate issue every run.
          NUMBER=$(gh issue list --state open --limit 200 --json number,title \
            | jq -r --arg t "$TITLE" \
              '[.[] | select(.title == $t)] | .[0].number // empty')
          if [ -z "$NUMBER" ]; then
            echo "Creating the delivery issue."
            NUMBER=$(gh issue create --title "$TITLE" \
              --body "Each matchday card is posted here when the selections change, and whenever a run is degraded. Recommendations only; no bet is ever placed." \
              | grep -o '[0-9]*$')
          fi
          gh issue comment "$NUMBER" --body-file card_comment.md
          echo "Card posted to issue #$NUMBER."

      - name: Publish the card to the card-feed branch
        # This is the delivery now. The EPL CARD routine reads today's card
        # from this branch with the plain git credential a cloud session
        # already holds for the repository — no API call, no extra token, no
        # inbox. Every run publishes here, including runs that decide not to
        # comment, so a missing commit for today means the workflow itself did
        # not finish, which is exactly what the routine should speak up about.
        #
        # ONE EXCEPTION, and it protects that promise rather than weakening it:
        # a degraded run never replaces a good card from the same day. The feed
        # holds two files and the last writer wins, so a run that produces
        # nothing would otherwise overwrite a card that had already been built
        # and delivered — and the day's later triggers are exactly the ones most
        # likely to arrive after a deadline. Today's commit is already on the
        # branch when this skip fires, so "no commit today" still means "the run
        # did not finish". The blocked run is still recorded: it finishes red,
        # its summary says what broke, and the issue comment carries it.
        #
        # Plumbing commits on purpose: the working tree is full of generated
        # files that must never reach a branch, and hash-object/mktree/
        # commit-tree build the two-file commit without touching it. Each push
        # parents on the current tip, so it is always a fast-forward and never
        # a force.
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          # The checkout deliberately drops its credential, so this step
          # authenticates its own git calls. The token is the run's own, masked
          # in logs, and dies with the runner.
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}"
          DAY=$(TZ=America/New_York date +%F)
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ ! -f card_comment.md ]; then
            echo "No card was rendered this run." > card_comment.md
          fi
          jq -n \
            --arg date "$DAY" \
            --arg degraded "${{ steps.health.outputs.degraded || 'unknown' }}" \
            --arg trigger "${{ github.event_name }}" \
            --arg run_url "$RUN_URL" \
            '{date: $date, degraded: $degraded, trigger: $trigger,
              run_url: $run_url}' > card_status.json
          BLOB_MD=$(git hash-object -w card_comment.md)
          BLOB_JSON=$(git hash-object -w card_status.json)
          TREE=$(printf '100644 blob %s\tlatest_card_comment.md\n100644 blob %s\tlatest_status.json' \
            "$BLOB_MD" "$BLOB_JSON" | git mktree)
          PARENT=""
          if git fetch "$REMOTE" +refs/heads/card-feed:refs/card-feed-tip 2>/dev/null; then
            PARENT=$(git rev-parse refs/card-feed-tip)
          fi
          # A good card outranks a later bad one from the same day. "unknown"
          # counts as degraded here: a run that cannot say whether it went
          # wrong is not evidence good enough to discard a card that worked.
          DEGRADED="${{ steps.health.outputs.degraded || 'unknown' }}"
          if [ -n "$PARENT" ] && [ "$DEGRADED" != "false" ]; then
            PREV=$(git show "$PARENT:latest_status.json" 2>/dev/null || echo "{}")
            PREV_DAY=$(printf '%s' "$PREV" | jq -r '.date // ""')
            PREV_DEGRADED=$(printf '%s' "$PREV" | jq -r '.degraded // ""')
            if [ "$PREV_DAY" = "$DAY" ] && [ "$PREV_DEGRADED" = "false" ]; then
              echo "card-feed left alone: $DAY already holds a good card and this run is degraded ($DEGRADED)."
              echo "The blocked card is in this run's summary and in the issue comment."
              exit 0
            fi
          fi
          export GIT_AUTHOR_NAME="Matchday Refresh" GIT_AUTHOR_EMAIL="actions@github.com"
          export GIT_COMMITTER_NAME="Matchday Refresh" GIT_COMMITTER_EMAIL="actions@github.com"
          if [ -n "$PARENT" ]; then
            COMMIT=$(git commit-tree "$TREE" -p "$PARENT" -m "card $DAY")
          else
            COMMIT=$(git commit-tree "$TREE" -m "card $DAY")
          fi
          git push "$REMOTE" "$COMMIT:refs/heads/card-feed"
          echo "card-feed updated for $DAY."

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matchday-reports
          path: |
            data/outputs/status.html
            data/outputs/run_summary.md
            # When a fetch fails, this is the report that says why. Leaving it
            # out meant a blocked run could only be diagnosed by adding it and
            # running again.
            data/outputs/provider_shadow_verification.md
            data/outputs/staging_input_validation.md
            data/outputs/automated_card_input.md
            data/outputs/automated_card.md
            data/outputs/automated_card_comparison.md
            data/outputs/epl_model_task.md
            data/outputs/epl_card_task.md
            data/outputs/epl_settle_preview_task.md
          if-no-files-found: warn
          retention-days: 30

      - name: Upload the state for the next run
        # The card archive and the match dataset together are the only link
        # between one matchweek and the next, which is why they outlive the
        # reports.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matchday-state
          path: |
            data/outputs/archive/automated_cards
            data/processed/epl_historical_matches.csv
          if-no-files-found: warn
          retention-days: 90

      - name: Report the outcome
        # Last, and the only step that can fail the job. Everything above is
        # allowed to degrade so that the card still gets built, summarised, and
        # delivered; the run then finishes red so the failure notice arrives.
        if: always()
        run: |
          echo "This job refetched prices and rebuilt reports."
          echo "It placed no bet, applied no settlement, edited no protected"
          echo "manual file, allowlisted no provider, and widened no market scope."
          if [ "${{ steps.rebuild.outcome }}" = "failure" ]; then
            echo "Some reports failed to rebuild."
          fi
          if [ "${{ steps.health.outputs.expected_refusal }}" = "true" ]; then
            # The policy declined, which is the policy working. A red run here
            # produced a week of alarming mail and a health check that
            # concluded the pipeline was broken.
            echo "::notice::The provider run was refused by policy, as expected outside the Thursday window. Not a fault."
            exit 0
          fi
          if [ "${{ steps.health.outputs.degraded }}" = "true" ] \
             || [ "${{ steps.rebuild.outcome }}" = "failure" ]; then
            echo "::error::This run was degraded. The card was still built and emailed; see the job summary."
            exit 1
          fi
          echo "Clean run."
