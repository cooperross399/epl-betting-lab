name: Model Research (temporary)
on:
  push:
    branches: [claude/model-learns-each-fixture-or3h2x]
    paths: ["research/**", ".github/workflows/model-research.yml"]
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .
      - run: bash research/run.sh
