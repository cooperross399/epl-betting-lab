name: Provider Credential Check

# Manual only. The single trigger below is deliberate: this is an on-demand
# check that the repository secret authenticates, never a background job.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-credential:
    name: Provider Credential Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Check provider credential
        # The secret is passed as an environment variable and never echoed.
        # GitHub also masks registered secret values in logs, so this is
        # defence in depth rather than the only protection. The script itself
        # reports only outcome, status, length, and safe usage headers.
        env:
          EPL_ODDS_API_KEY: ${{ secrets.EPL_ODDS_API_KEY }}
        run: |
          python scripts/check_provider_credential.py --no-env-file

      - name: Scan the job log guidance
        if: always()
        run: |
          echo "This job prints no credential material."
          echo "It calls the free sports-list endpoint, so quota cost is 0."
          echo "It fetches no odds, generates no picks, places no bets,"
          echo "applies no settlement, and runs only when dispatched."
