name: Provider Evidence Refresh

# Fetches live provider prices and rebuilds the allowlist review evidence —
# shadow verification, staging validation, and the provider-derived card
# input — then uploads all of it as an artifact.
#
# This exists so allowlist PRs can carry fresh evidence generated with the
# repository's real credential even when no local machine holds a working
# key. Dispatch it on the PR branch whose policy the evidence should reflect.
#
# It deliberately does NOT generate picks, build or email a card, post to any
# issue, upload matchday state, or write to any protected manual file. The
# evidence it produces trusts nothing by itself: enabling a market still
# requires the Provider Policy PR Gate and a human approval block.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Never let two refreshes write staging at once, and never race the
  # matchday refresh for the same staging files on this runner group.
  group: provider-evidence-refresh
  cancel-in-progress: false

jobs:
  refresh-evidence:
    name: Provider Evidence Refresh
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Fetch historical results
        env:
          PYTHONPATH: src
        run: |
          python scripts/fetch_data.py

      - name: Run live shadow verification
        env:
          EPL_ODDS_API_KEY: ${{ secrets.EPL_ODDS_API_KEY }}
          PYTHONPATH: src
        run: |
          python scripts/run_provider_shadow_verification.py \
            --provider odds_api --live --overwrite-staging --include-event-markets

      - name: Build the provider-derived card input
        env:
          PYTHONPATH: src
        run: |
          python scripts/run_api_first_card_workflow.py

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-evidence
          path: |
            data/staging/**
            data/outputs/**
          retention-days: 14
