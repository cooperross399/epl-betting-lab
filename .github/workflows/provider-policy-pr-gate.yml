name: Provider Policy PR Gate

on:
  pull_request:
  # Re-run when the reviewer approves in the GitHub UI, so the gate can pick up
  # the approval without anyone touching a terminal.
  pull_request_review:
    types: [submitted, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  verify-provider-policy-evidence:
    name: Provider Policy PR Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROVIDER_POLICY_PR_NUMBER: ${{ github.event.pull_request.number }}
      PROVIDER_POLICY_PR_URL: ${{ github.event.pull_request.html_url }}
      PROVIDER_POLICY_JOB_NAME: Provider Policy PR Gate

    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Create receipt from GitHub approval
        # The human act is a GitHub review or comment by an allowed reviewer.
        # This only verifies and transcribes it; it cannot author an approval.
        #
        # It deliberately does NOT regenerate the checklist, evidence bundle,
        # preview, or conformance. Those are committed to the PR and bound by
        # checksum: rebuilding them here changes their bundle id and checksum,
        # which invalidates the very verification the gate is about to check.
        #
        # Allowed to fail so a missing approval surfaces as the gate's own
        # "receipt missing" result rather than an opaque step crash.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/create_receipt_from_github_approval.py \
            --pr "${{ github.event.pull_request.number }}" \
            --repository "${{ github.repository }}" \
            --provider odds_api \
            --markets "1x2,btts" \
            --write-receipt

      - name: Check provider policy PR gate
        run: |
          python scripts/check_provider_policy_pr_gate.py \
            --provider odds_api \
            --base-ref "${{ github.event.pull_request.base.sha }}" \
            --head-ref "${{ github.event.pull_request.head.sha }}"

      - name: Verify provider policy PR gate receipt
        if: always()
        run: |
          python scripts/verify_provider_policy_pr_gate_receipt.py \
            --provider odds_api

      - name: Archive provider policy PR gate verification
        if: always()
        run: |
          python scripts/archive_provider_policy_pr_gate_verification.py \
            --provider odds_api

      - name: Diagnose evidence bundle mismatch
        # Runs only when the gate failed. Explains a computed-vs-stored bundle
        # mismatch instead of leaving it to guesswork against a safety gate.
        # Diagnostic only: paths, checksums, counts. No file contents and no
        # credential material are ever emitted.
        if: failure()
        run: |
          python scripts/diagnose_evidence_bundle.py

      - name: Upload evidence bundle diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: provider-bundle-diagnostic
          path: |
            data/outputs/provider_bundle_diagnostic.json
            data/outputs/provider_bundle_diagnostic.md
          if-no-files-found: ignore

      - name: Add gate receipt report to job summary
        if: always()
        shell: bash
        run: |
          if [[ -f data/outputs/provider_policy_pr_gate.md ]]; then
            cat data/outputs/provider_policy_pr_gate.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Provider Policy PR Gate" >> "$GITHUB_STEP_SUMMARY"
            echo "The gate did not produce a report." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Add gate receipt verification to job summary
        if: always()
        shell: bash
        run: |
          if [[ -f data/outputs/provider_policy_pr_gate_receipt_verification.md ]]; then
            cat data/outputs/provider_policy_pr_gate_receipt_verification.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Provider Policy PR Gate Receipt Verification" >> "$GITHUB_STEP_SUMMARY"
            echo "The receipt verifier did not produce a report." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Add gate verification archive to job summary
        if: always()
        shell: bash
        run: |
          if [[ -f data/outputs/provider_policy_pr_gate_verification_archive.md ]]; then
            cat data/outputs/provider_policy_pr_gate_verification_archive.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Provider Policy PR Gate Verification Archive" >> "$GITHUB_STEP_SUMMARY"
            echo "The verification archive did not produce a report." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload provider policy gate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-policy-pr-gate
          path: |
            data/outputs/provider_policy_pr_gate.json
            data/outputs/provider_policy_pr_gate.md
            data/outputs/provider_policy_pr_gate.csv
            data/outputs/provider_policy_pr_gate_receipt_verification.json
            data/outputs/provider_policy_pr_gate_receipt_verification.md
            data/outputs/provider_policy_pr_gate_receipt_verification.csv
            data/outputs/provider_policy_pr_gate_verification_archive.json
            data/outputs/provider_policy_pr_gate_verification_archive.md
            data/outputs/provider_policy_pr_gate_verification_archive.csv
            data/outputs/archive/provider_policy_pr_gate_verifications/**
          if-no-files-found: warn
          retention-days: 14
