name: Publish Board

# Builds this lab's public board.json and deploys it to this repository's
# GitHub Pages. The projections site (hosted from nhl-betting-lab) reads it
# by URL in the browser, so no cross-repository token exists anywhere.
#
# Runs after every Matchday Refresh and on its own clock, so a dark day still
# refreshes the slate. Read-only on repository contents (see permissions),
# pushes to no branch, fetches no odds, spends no credit, edits no policy,
# and places no bet.
on:
  schedule:
    - cron: "30 8 * * *"   # 08:30 UTC daily, before the card
  workflow_run:
    workflows: ["Matchday Refresh"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  # Not cancel-in-progress: a cancelled `deploy-pages` leaves the Pages
  # deployment half-made, and this job is cheap enough to let finish.
  group: publish-board
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Board
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # The same exact minor every other workflow here pins, and the one
          # the suite is green on. A board built on an interpreter nothing
          # else in this repository uses would be the only place a 3.12-only
          # behaviour could first appear, in public.
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Restore the lab's latest run and the board's history
        id: restore
        # Allowed to find nothing: before the first card the board is schedule-only and says so.
        #
        # WHAT EACH ARTIFACT ACTUALLY CONTAINS, read off the `upload-artifact`
        # steps in matchday-refresh.yml rather than assumed. upload-artifact@v4
        # roots the archive at the least common ancestor of the paths it is
        # given, so the `--dir` below has to be that ancestor or the files land
        # one level deep and the build silently sees none of them:
        #
        #   matchday-state   paths data/outputs/archive/automated_cards,
        #                    data/processed/epl_historical_matches.csv,
        #                    data/processed/understat_team_xg.csv
        #                    -> ancestor `data`, so `--dir data`.
        #   matchday-reports paths data/outputs/*.md and status.html
        #                    -> ancestor `data/outputs`, so `--dir data/outputs`.
        #
        # `data/outputs/automated_card.json` is in NEITHER artifact — the
        # reports artifact carries `automated_card.md`, which is prose. The
        # card the board reads therefore comes from the archived copy inside
        # matchday-state (`data/outputs/archive/automated_cards/<date>/<time>/
        # automated_card.json`), which is also what `card_scoreboard` reads for
        # the settled record. `build_board_json.py` falls back to it by design.
        # Adding the JSON to the reports artifact would mean editing a workflow
        # that spends provider credits, which this change does not do.
        #
        # `data/staging/` is in .gitignore and is uploaded by nothing, so the
        # provider price file cannot be restored at all; the build reads the
        # prices off the card's own rows and the board says which it used.
        #
        # `--status completed`, never `--status success`: a matchday run is red
        # by design while an upstream feed is down, and both uploads above are
        # `if: always()`, so the artifacts of a red run are exactly the state
        # this needs. Pinning the equivalent restore to green runs once froze
        # the card archive for nine runs — see the note on "Restore the
        # previous state" in matchday-refresh.yml and
        # tests/test_schedule_health.py.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          # WALK BACK, DO NOT PIN TO THE NEWEST. `--limit 1` asks for the most
          # recent COMPLETED run, and "completed" includes failed, cancelled
          # and timed-out. A run that died before its upload step carries no
          # artifact at all, so pinning to it restores nothing — and the `||`
          # below turns that into a line of log rather than a stop.
          #
          # matchday-refresh.yml already learned this: pinning its equivalent
          # restore froze the card archive for nine runs, and it now loops over
          # ten candidates until one actually carries the artifact. This file
          # kept the pinned version in both of its restores.
          #
          # For the history the stakes are higher than a frozen archive.
          # `web/site_history.py` rebuilds `history/index.json` from whatever
          # files are on disk, so an empty restore does not fail — it produces
          # a one-entry history, uploads it over the chain, and deploys it to
          # the public Archive page. Every earlier frozen board and every line
          # series would go, and the run would finish green.
          mkdir -p data data/outputs
          restored=""
          for candidate in $(gh run list --workflow matchday-refresh.yml \
            --limit 10 --json databaseId --jq '.[].databaseId'); do
            if gh run download "$candidate" --name matchday-state --dir data 2>/dev/null; then
              restored="$candidate"
              gh run download "$candidate" --name matchday-reports --dir data/outputs 2>/dev/null \
                || echo "Run $candidate carried state but no reports."
              break
            fi
          done
          if [ -n "$restored" ]; then
            echo "Restored the lab's state from run $restored."
          else
            echo "No recent Matchday Refresh carried state; building schedule-only."
          fi

          mkdir -p dist/data/history
          seen=0
          from_run=""
          for candidate in $(gh run list --workflow publish-board.yml \
            --limit 10 --json databaseId --jq '.[].databaseId'); do
            seen=$((seen + 1))
            if gh run download "$candidate" --name board-history --dir dist/data/history 2>/dev/null; then
              from_run="$candidate"
              break
            fi
          done
          boards=$(find dist/data/history -maxdepth 1 -name '*.json' ! -name index.json 2>/dev/null | wc -l | tr -d ' ')
          if [ -n "$from_run" ]; then
            echo "Restored $boards frozen board(s) from run $from_run."
          else
            echo "No board-history artifact on any of the last $seen publish run(s); the history starts today."
          fi
          # Read by "The history must not shrink" further down. `seen` is there
          # so that "nothing to restore" can be told apart from "nothing has
          # ever been published", which are the same empty directory.
          echo "boards=$boards" >> "$GITHUB_OUTPUT"
          echo "candidates=$seen" >> "$GITHUB_OUTPUT"

      - name: Say what the restore actually found
        # A board that quietly publishes the schedule and nothing else looks
        # the same as one whose restore failed. This prints the difference.
        if: always()
        run: |
          set -u
          for f in data/processed/epl_historical_matches.csv \
                   data/processed/understat_team_xg.csv; do
            [ -f "$f" ] && echo "restored: $f" || echo "ABSENT: $f"
          done
          cards=$(ls -1 data/outputs/archive/automated_cards/*/*/automated_card.json 2>/dev/null | wc -l | tr -d ' ')
          echo "archived cards restored: $cards"

      - name: Assemble the site
        # This subdomain now serves the BOARD, not just its feed. web/ holds
        # the page, support.js, lib/ and the bundled sample data; the build
        # step below drops the real board.json in beside them, so the page
        # fetches ./data/board.json same-origin and no CORS question arises.
        #
        # build_board_json.py is removed from dist because publishing the
        # generator alongside what it generated invites someone to read the
        # published copy as the one that ran.
        run: |
          mkdir -p dist
          cp -R web/. dist/
          # Every generator, for the reason above: site_history.py and
          # settle_results.py arrived with the shared pages and would
          # otherwise be served as source next to what they produced.
          rm -f dist/*.py
          touch dist/.nojekyll

      - name: Build the board
        env:
          PYTHONPATH: src
        run: |
          python web/build_board_json.py --lab . --out dist/data
          python web/site_history.py --data dist/data
          python web/settle_results.py --data dist/data --sport epl
          printf '{"sport":"epl"}' > dist/site.json

      - name: The history must not shrink
        # HARD, and deliberately before both the upload and the Pages deploy.
        # Those two are what make a wipe permanent: the artifact becomes the
        # newest one the next run will find, and the deploy replaces the public
        # Archive page. Stopping here costs one day's board and keeps every
        # earlier one; stopping after them costs all of them.
        #
        # The restore above is `continue-on-error`, which is right — a missing
        # lab artifact should still produce a schedule-only board — but it
        # means a death inside that step is otherwise invisible. Its outcome is
        # checked here rather than there for that reason.
        #
        # NOT SOLVED BY GIVING "Keep the history" AN `if: always()`. That was
        # the obvious-looking fix and it is the wrong one: on a run that failed
        # midway, `dist/data/history` holds a partial history, and uploading it
        # would make the partial copy the newest artifact — poisoning the chain
        # instead of leaving it intact. A failed run should carry no
        # board-history artifact at all, which is what no `if:` already gives.
        # The fix belongs on the restore, which now walks back to the last run
        # that actually has one.
        run: |
          set -u
          before="${{ steps.restore.outputs.boards }}"
          after=$(find dist/data/history -maxdepth 1 -name '*.json' ! -name index.json | wc -l | tr -d ' ')

          if [ "${{ steps.restore.outcome }}" != "success" ]; then
            echo "::error::The restore step did not succeed (${{ steps.restore.outcome }}), so what it found cannot be trusted. Refusing to publish a history over the existing chain."
            exit 1
          fi
          if [ -z "$before" ]; then
            echo "::error::The restore step reported no board count. It died before saying what it found, so this run cannot tell a fresh history from a wiped one. Refusing to publish."
            exit 1
          fi
          if [ "$after" -lt "$before" ]; then
            echo "::error::The history shrank: restored $before frozen board(s), about to publish $after. Refusing to overwrite the chain and the Archive page."
            exit 1
          fi
          echo "History intact: $before restored, $after to publish."

      - name: Keep the history
        # No `if:` on purpose — see the step above. A run that failed partway
        # must leave no artifact rather than a truncated one.
        uses: actions/upload-artifact@v4
        with:
          name: board-history
          path: dist/data/history
          if-no-files-found: warn
          retention-days: 400

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Report the outcome
        if: always()
        run: |
          echo "This job built the public EPL board from the schedule and the lab's outputs."
          echo "It fetched no odds, spent no credit, pushed no branch, and edited no policy."
          echo "The board is a projection and a record; no bet is ever placed, here or by"
          echo "anything it publishes."
