name: Tests

# Runs the full suite on every pull request and on main. This is what makes
# "CI is green" mean the suite passed, rather than only that the policy gate
# passed. It uses no secrets and fetches no odds, so it is safe to run on any
# branch.
#
# The job below is named `Full test suite`, and that name is a contract:
# branch protection on `main` requires that status context (alongside
# `Provider Policy PR Gate`), so nothing merges with it red. That sentence is
# true here because this repository is public and protected; it is not a
# property of the YAML. Read on 2026-09-05 with
# `gh api repos/cooperross399/epl-betting-lab/branches/main/protection`:
# required contexts `Full test suite` and `Provider Policy PR Gate`,
# enforce_admins true, force pushes and deletions off. Re-read it rather than
# trusting this line; it is a snapshot of a setting nothing here can see.
#
# WHAT THE SUITE ITSELF ENFORCES about this file, so the list can be checked
# rather than believed. tests/test_workflows.py parses it with yaml.safe_load
# and fails if: the job is renamed or a second job takes the name; no step
# invokes pytest as a command; the pytest line carries an argument outside the
# whitelist (`-q`, `-rs`, `-p no:...`) — a whitelist, because `--version` and
# `-h` exit 0 having run nothing and no blocklist of narrowing flags contains
# them; PYTEST_ADDOPTS or PYTEST_PLUGINS is bound anywhere, in any spelling;
# the job carries `needs:` or `strategy:`, or any OTHER job in this file
# carries an `if:` — GitHub's troubleshooting documentation says a
# conditionally-skipped required check is treated as successful, so a required
# job skipped by a `needs:` on a job that did not run is `if: false` reworded.
# That is GitHub's behaviour and not this repository's: no test here can run
# it, which is why the rule refuses the shape outright rather than reasoning
# about it; the job or a step carries an `if:` other than always(),
# continue-on-error, or a shell override; pull_request is filtered; the
# secrets context is touched; or the suite step does not set PYTHONSAFEPATH.
# It then EXECUTES every run block here under stubs and requires that a
# failing command fails the block, and it reads the PYTHONSAFEPATH each
# command was actually invoked with, because `PYTHONSAFEPATH= python -m
# pytest` is a prefix assignment that unsays the `env:` above it.
#
# The "Refuse a tracked module that would replace the test runner" step below
# runs BEFORE the suite on purpose. A tracked pytest.py on the working
# directory or on PYTHONPATH IS the suite, so the suite cannot report it;
# tests/test_the_guards_exist.py makes the same assertion for the case where
# the suite does get to run.
#
# WHAT IT DOES NOT COVER, so nobody reads more into a green check than is
# there: branch protection itself lives in repository settings, not in this
# repository, and a settings change is invisible to every test here; a commit
# that deletes the guard modules AND tests/conftest.py together is green,
# because nothing outside the suite vouches for the suite; and a plugin added
# to requirements.txt runs before the guards are counted. A reviewer is the
# backstop for all three, and that backstop is a practice rather than a gate:
# the same protection read shows no required review on `main`, so nothing
# outside this repository forces a second pair of eyes onto such a commit.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: Full test suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Compile every module
        # A module can be syntactically invalid on the CI Python and still pass
        # the suite if no test imports it. weekly_card.py sat broken on 3.11 for
        # over a month that way, failing only the scheduled job nobody reads.
        #
        # The existence checks are the gate, not decoration: `compileall`
        # prints "Can't list 'src'" and EXITS 0 when a path names nothing
        # (run on 3.12, not recalled), so a rename or a bad checkout would turn
        # this step into a green report about no files. `-f` forces
        # recompilation so a stale __pycache__ cannot mask a source that no
        # longer parses — run rather than recalled in tests/test_workflows.py
        # (`test_a_stale_pycache_hides_a_broken_source_from_compileall_without_f`):
        # break a module, restore its mtime, and the plain command exits 0
        # while `-f` exits 1. tests/test_workflows.py also runs this block in a
        # sandbox with each path absent in turn and requires a non-zero exit.
        run: |
          for d in src scripts; do
            [ -d "$d" ] || { echo "::error::$d is missing; the compile step would have passed on nothing."; exit 1; }
          done
          [ -f app.py ] || { echo "::error::app.py is missing; the compile step would have passed on nothing."; exit 1; }
          python -m compileall -q -f src scripts app.py

      - name: Refuse a tracked module that would replace the test runner
        # A tracked pytest.py in the working directory or on a PYTHONPATH
        # entry IS the suite: `python -m pytest` imports it and exits 0 having
        # run nothing, so no test in the suite can report it — the shadow is
        # what stops the suite from starting. tests/test_the_guards_exist.py
        # makes the same assertion; this step is what makes it in time.
        # PYTHONPATH is bound to the same value the suite step uses, and
        # tests/test_the_guards_exist.py fails if the two drift apart.
        env:
          PYTHONPATH: src
          PYTHONSAFEPATH: "1"
        run: |
          python scripts/refuse_shadow_modules.py

      - name: Run the full test suite
        # No credential is provided on purpose: every test must pass without
        # one. A test that needs a live key would make the suite unrunnable on
        # a fork and would risk exposing the key in a log.
        env:
          PYTHONPATH: src
          # `python -m` puts the working directory ahead of site-packages, so
          # a tracked root pytest.py shadows the suite entirely: run again at
          # c8ebe33, a two-line tracked pytest.py in the repository root made
          # `PYTHONPATH=src python -m pytest -q` print one line and exit 0.
          # PYTHONSAFEPATH drops that entry; PYTHONPATH is untouched, and the
          # suite is green under it with NO SKIPS -- a skip ends the session
          # red here, so "green" means every collected test ran. No test count
          # and no wall clock is written down: both move with every commit,
          # and a stale absolute in a file whose whole job is to be trusted is
          # worse than no number at all.
          # tests/test_the_guards_exist.py refuses the tracked shadow names as
          # well; this is the belt behind that brace.
          PYTHONSAFEPATH: "1"
        run: |
          python -m pytest -q

      - name: Confirm no odds were fetched
        if: always()
        run: |
          echo "This job installs the project and runs unit tests only."
          echo "It uses no repository secret, makes no provider request,"
          echo "places no bets, applies no settlement, and runs on demand"
          echo "or on pull requests rather than on a timer."
