name: Weekly Lab Check

on:
  workflow_dispatch:
  schedule:
    # Mondays at 10:00 AM UTC during the season. Adjust as needed.
    - cron: "0 10 * * 1"

jobs:
  test-and-brief:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Compile check
        run: python -m compileall -q src scripts app.py

      - name: Run tests
        run: python -m pytest

      - name: Build historical dataset
        run: python scripts/fetch_data.py --seasons 2122 2223 2324 2425 2526

      - name: Run backtest
        run: python scripts/run_backtest.py

      - name: Build agent weekly brief
        run: python scripts/agent_weekly_brief.py --current-season 2526 --recent-matches 6

      - name: Upload outputs
        uses: actions/upload-artifact@v4
        with:
          name: epl-betting-lab-outputs
          path: data/outputs/
