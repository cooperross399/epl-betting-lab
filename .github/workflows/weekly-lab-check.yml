name: Weekly Lab Check

on:
  workflow_dispatch:
  schedule:
    # Mondays at 10:00 AM UTC during the season. Adjust as needed.
    - cron: "0 10 * * 1"

permissions:
  contents: read
  # Read-only, and only so the watchdog can see whether the matchday schedule
  # has run. It changes nothing.
  actions: read

jobs:
  test-and-brief:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Compile check
        # compileall exits 0 on a path that names nothing, so each path is
        # asserted first and -f forces recompilation past a stale __pycache__.
        # Same shape as tests.yml, where tests/test_workflows.py executes it.
        run: |
          for d in src scripts; do
            [ -d "$d" ] || { echo "::error::$d is missing; the compile step would have passed on nothing."; exit 1; }
          done
          [ -f app.py ] || { echo "::error::app.py is missing; the compile step would have passed on nothing."; exit 1; }
          python -m compileall -q -f src scripts app.py

      - name: Run tests
        run: python -m pytest

      - name: Build historical dataset
        # No --seasons: the list is derived from the date, so this picks up a
        # new season each August without anyone editing this file.
        run: python scripts/fetch_data.py

      - name: Run backtest
        run: python scripts/run_backtest.py

      - name: Build agent weekly brief
        # No --current-season, for the same reason.
        run: python scripts/agent_weekly_brief.py --recent-matches 6

      - name: Upload outputs
        uses: actions/upload-artifact@v4
        with:
          name: epl-betting-lab-outputs
          path: data/outputs/

      - name: Watch that the matchday schedule is still running
        # An independent schedule, so this does not share the failure it is
        # meant to catch. Nothing can detect its own total absence; two
        # unrelated crons failing in the same week is far less likely than one.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: src
        run: |
          set -u
          previous=$(gh run list --workflow matchday-refresh.yml \
            --status success --limit 5 --json createdAt \
            --jq '.[].createdAt' | tr '\n' ' ')
          python scripts/check_schedule_health.py $previous --fail-when-stale

      - name: Watch that the closing snapshot is still running
        # Added 2026-09-02 with the price feed, because that feed is the only
        # forward evidence the corner markets will ever have and it fails
        # silently by design: `live_clv` ignores any observation taken after
        # kick-off, so a snapshot that never fires and one that always fires
        # late produce the same empty column. Nothing else would notice.
        #
        # A longer window than the matchday check: snapshots run on match days
        # only, so an international break is legitimately quiet.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: src
        run: |
          set -u
          previous=$(gh run list --workflow closing-snapshot.yml \
            --status success --limit 5 --json createdAt \
            --jq '.[].createdAt' | tr '\n' ' ')
          if [ -z "$previous" ]; then
            echo "::warning::No successful Closing Snapshot run on record yet."
            exit 0
          fi
          python scripts/check_schedule_health.py $previous \
            --max-days 14 --fail-when-stale
