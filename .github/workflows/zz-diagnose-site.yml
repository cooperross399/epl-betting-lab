name: Diagnose live site (temporary)
on:
  push:
    branches: [claude/project-thread-47v2pc]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: DNS and HTTP
        run: |
          for h in epl.maverickhightower.com maverickhightower.com nhl.maverickhightower.com cooperross399.github.io; do
            echo "== dig $h"; dig +short $h; dig +short CNAME $h
          done
          for u in https://epl.maverickhightower.com/ https://epl.maverickhightower.com/data/board.json https://epl.maverickhightower.com/data/results.json https://epl.maverickhightower.com/data/history/index.json https://epl.maverickhightower.com/support.js https://maverickhightower.com/ https://nhl.maverickhightower.com/ https://cooperross399.github.io/epl-betting-lab/; do
            echo "== $u"; curl -sS -o /tmp/body -w "%{http_code} %{size_download} %{url_effective}\n" -L --max-time 20 "$u" || true
            head -c 300 /tmp/body; echo
          done
          curl -sSI https://epl.maverickhightower.com/ || true
      - name: Save board.json
        run: |
          mkdir -p out
          curl -sS -L https://epl.maverickhightower.com/data/board.json -o out/board.json || true
          curl -sS -L https://epl.maverickhightower.com/data/results.json -o out/results.json || true
          curl -sS -L https://epl.maverickhightower.com/data/history/index.json -o out/history_index.json || true
          python3 -c "import json;d=json.load(open('out/board.json'));print(json.dumps(d,indent=1)[:6000])" || true
      - uses: actions/upload-artifact@v4
        with: { name: live-site, path: out }
      - name: Render in a browser
        run: |
          npm i playwright@1.56.1 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > r.js <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const b = await chromium.launch();
            for (const u of ['https://epl.maverickhightower.com/','https://epl.maverickhightower.com/Results.dc.html','https://epl.maverickhightower.com/Archive.dc.html','https://maverickhightower.com/']) {
              const p = await b.newPage();
              p.on('console', m => { if (m.type()==='error'||m.type()==='warning') console.log('CONSOLE', m.type(), m.text().slice(0,400)); });
              p.on('pageerror', e => console.log('PAGEERROR', e.message, (e.stack||'').slice(0,800)));
              p.on('requestfailed', r => console.log('REQFAIL', r.url(), r.failure()?.errorText));
              p.on('response', r => { if (r.status() >= 400) console.log('HTTP', r.status(), r.url()); });
              await p.goto(u, { waitUntil: 'networkidle', timeout: 45000 }).catch(e=>console.log('GOTO', e.message));
              await p.waitForTimeout(3000);
              console.log('=====', u); console.log((await p.evaluate(() => document.body.innerText)).slice(0, 2500));
            }
            await b.close();
          })();
          JS
          node r.js
