[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epl-betting-lab"
version = "0.1.0"
description = "Starter Python project for EPL betting strategy research and weekly betting cards."
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.2.0",
  "numpy>=1.26.0",
  "requests>=2.31.0",
  "scipy>=1.13.0",
  "streamlit>=1.36.0",
  "python-dotenv>=1.0.1",
  "tabulate>=0.9.0",
]

[tool.setuptools.packages.find]
where = ["src"]
